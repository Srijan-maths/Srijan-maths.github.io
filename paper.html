<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mathematics Paper | Srijan Maths</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        .container {
            width: min(1000px, 94%);
            margin: auto;
            padding: 35px 0 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 3rem);
        }

        .mode {
            padding: 8px 16px;
            border-radius: 30px;
            background: #7a00ff;
            font-weight: bold;
        }

        .timer {
            position: sticky;
            top: 10px;
            z-index: 10;
            background: #171722;
            border: 1px solid #353546;
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .timer.warning {
            background: #4b1111;
            border-color: #ff4444;
            color: #ff7777;
        }

        .problem {
            background: #15151f;
            border: 1px solid #292938;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .problem-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .problem-number {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .problem-meta {
            color: #aaa;
            font-size: 0.9rem;
        }

        .question {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .answer-input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #3b3b4b;
            background: #0d0d15;
            color: white;
            font-size: 1rem;
        }

        .answer-input:focus {
            outline: none;
            border-color: #7a00ff;
        }

        .correct {
            border-color: #00ff66 !important;
        }

        .incorrect {
            border-color: #ff4444 !important;
        }

        .result {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #101018;
        }

        .solution {
            display: none;
            margin-top: 12px;
            padding: 15px;
            border-left: 3px solid #7a00ff;
            background: #0f0f18;
            color: #ccc;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                #7a00ff,
                #00e5ff
            );
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .final-result {
            display: none;
            text-align: center;
            padding: 30px;
            margin-top: 30px;
            background: #15151f;
            border: 1px solid #292938;
            border-radius: 18px;
        }

        .final-result h2 {
            font-size: 2rem;
        }

        .error {
            background: #4b1111;
            border: 1px solid #ff4444;
            color: #ffaaaa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .back {
            display: block;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            margin-top: 25px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>
            Mathematics Paper
        </h1>

        <div
            id="mode"
            class="mode"
        >
            Practice
        </div>

    </div>


    <div
        id="timer"
        class="timer"
        style="display:none;"
    >
        Time Remaining:
        <span id="time">
            00:00:00
        </span>
    </div>


    <div id="paper"></div>


    <button
        id="submitBtn"
        class="submit-btn"
        onclick="submitPaper()"
    >
        Submit Paper
    </button>


    <div
        id="finalResult"
        class="final-result"
    >

        <h2>
            Your Result
        </h2>

        <div id="score"></div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Mathematics Engine
    </a>

</div>


<!-- ================================= -->
<!-- ANSWER CHECKER                    -->
<!-- ================================= -->

<script src="math-generator/core/answerChecker.js"></script>


<script>

const storedPaper =
    sessionStorage.getItem(
        "generatedPaper"
    );


const paperMode =
    sessionStorage.getItem(
        "paperMode"
    );


let paper = null;

let timerInterval = null;

let timeRemaining = 0;


/* =====================================
   LOAD PAPER
   ===================================== */

function loadPaper() {

    const container =
        document.getElementById(
            "paper"
        );


    if (!storedPaper) {

        container.innerHTML = `
            <div class="error">
                <strong>No paper found.</strong><br>
                Please generate a Practice Set or Mock Test first.
            </div>
        `;

        document.getElementById(
            "submitBtn"
        ).style.display = "none";

        return;
    }


    try {

        paper =
            JSON.parse(
                storedPaper
            );


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                The generated paper could not be read.
            </div>
        `;

        return;
    }


    console.log(
        "Loaded paper:",
        paper
    );


    /*
     * THIS IS THE IMPORTANT PART.
     *
     * PaperGenerator returns:
     *
     * paper.questions
     */

    if (
        !Array.isArray(
            paper.questions
        )
    ) {

        container.innerHTML = `
            <div class="error">
                The paper contains no questions.
                <br><br>
                Open the browser console to inspect the generated paper.
            </div>
        `;

        return;
    }


    if (
        paper.questions.length === 0
    ) {

        container.innerHTML = `
            <div class="error">
                The generator returned zero questions.
            </div>
        `;

        return;
    }


    /*
     * Set mode
     */

    if (
        paper.mode === "mock" ||
        paperMode === "mock"
    ) {

        document.getElementById(
            "mode"
        ).textContent =
            "⏱️ Mock Test";


        document.getElementById(
            "timer"
        ).style.display =
            "block";


        timeRemaining =
            Number(
                paper.durationSeconds
            );


        if (
            !Number.isFinite(
                timeRemaining
            )
        ) {

            timeRemaining =
                3600;

        }


        startTimer();

    } else {

        document.getElementById(
            "mode"
        ).textContent =
            "🎯 Practice";

    }


    renderQuestions();

}


/* =====================================
   RENDER QUESTIONS
   ===================================== */

function renderQuestions() {

    const container =
        document.getElementById(
            "paper"
        );


    container.innerHTML = "";


    paper.questions.forEach(
        (problem, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "problem";


            const difficulty =
                problem.targetDifficulty ||
                problem.minDifficulty ||
                "";


            div.innerHTML = `

                <div class="problem-header">

                    <div class="problem-number">
                        Problem ${index + 1}
                    </div>

                    <div class="problem-meta">
                        ${escapeHTML(
                            problem.topic || ""
                        )}

                        ${
                            problem.subtopic
                            ? " • " +
                              escapeHTML(
                                  problem.subtopic
                              )
                            : ""
                        }

                        ${
                            difficulty
                            ? " • Difficulty " +
                              difficulty
                            : ""
                        }
                    </div>

                </div>


                <div class="question">
                    ${escapeHTML(
                        problem.question || ""
                    )}
                </div>


                <input
                    type="text"
                    class="answer-input"
                    id="answer-${index}"
                    placeholder="Enter your answer"
                >


                <div
                    class="result"
                    id="result-${index}"
                ></div>


                <div
                    class="solution"
                    id="solution-${index}"
                >
                    <strong>Solution:</strong><br>
                    ${escapeHTML(
                        problem.solution ||
                        "Solution unavailable."
                    )}
                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}


/* =====================================
   ANSWER CHECKING
   ===================================== */

function submitPaper() {

    clearInterval(
        timerInterval
    );


    let score = 0;


    paper.questions.forEach(
        (problem, index) => {

            const input =
                document.getElementById(
                    `answer-${index}`
                );


            const result =
                document.getElementById(
                    `result-${index}`
                );


            const solution =
                document.getElementById(
                    `solution-${index}`
                );


            const userAnswer =
                input.value.trim();


            let correct = false;


            try {

                const checked =
                    AnswerChecker.verify(
                        userAnswer,
                        problem.answer,
                        problem.answerType
                    );


                /*
                 * Your AnswerChecker returns
                 * an object containing isCorrect.
                 */

                correct =
                    checked.isCorrect;

            } catch (error) {

                console.error(
                    "Answer checking error:",
                    error
                );

                correct =
                    userAnswer ===
                    String(
                        problem.answer
                    ).trim();

            }


            input.classList.remove(
                "correct",
                "incorrect"
            );


            if (correct) {

                score++;

                input.classList.add(
                    "correct"
                );

                result.innerHTML =
                    "✓ Correct";

                result.style.display =
                    "block";

            } else {

                input.classList.add(
                    "incorrect"
                );

                result.innerHTML = `
                    ✗ Incorrect
                    <br>
                    <strong>
                        Correct answer:
                    </strong>
                    ${escapeHTML(
                        String(
                            problem.answer
                        )
                    )}
                `;

                result.style.display =
                    "block";


                solution.style.display =
                    "block";

            }

        }
    );


    const total =
        paper.questions.length;


    const percentage =
        total === 0
            ? 0
            : (
                score / total * 100
            ).toFixed(1);


    document.getElementById(
        "score"
    ).innerHTML = `

        <h3>
            ${score} / ${total}
        </h3>

        <p>
            Score: ${percentage}%
        </p>

    `;


    document.getElementById(
        "finalResult"
    ).style.display =
        "block";


    document.getElementById(
        "submitBtn"
    ).style.display =
        "none";


    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

}


/* =====================================
   TIMER
   ===================================== */

function startTimer() {

    updateTimer();


    timerInterval =
        setInterval(
            () => {

                timeRemaining--;


                updateTimer();


                if (
                    timeRemaining <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "Time is up! Your paper will now be submitted."
                    );


                    submitPaper();

                }

            },
            1000
        );

}


function updateTimer() {

    const hours =
        Math.floor(
            timeRemaining / 3600
        );


    const minutes =
        Math.floor(
            (timeRemaining % 3600) / 60
        );


    const seconds =
        timeRemaining % 60;


    document.getElementById(
        "time"
    ).textContent =

        String(hours).padStart(2, "0")
        + ":"
        + String(minutes).padStart(2, "0")
        + ":"
        + String(seconds).padStart(2, "0");


    if (
        timeRemaining <= 300
    ) {

        document.getElementById(
            "timer"
        ).classList.add(
            "warning"
        );

    }

}


/* =====================================
   HTML ESCAPING
   ===================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;

}


/* =====================================
   START
   ===================================== */

loadPaper();

</script>

</body>
</html>
