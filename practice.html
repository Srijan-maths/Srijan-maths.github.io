<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Mode | Srijan Maths</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: min(900px, 92%);
            margin: auto;
            padding: 50px 0;
        }

        h1 {
            text-align: center;
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 40px;
        }

        .card {
            background: #15151f;
            border: 1px solid #292938;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .topics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .topic {
            padding: 15px;
            border: 1px solid #363646;
            border-radius: 12px;
            cursor: pointer;
            background: #101018;
        }

        .topic:hover {
            border-color: #7a00ff;
        }

        .topic input {
            margin-right: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #3a3a4a;
            background: #0d0d15;
            color: white;
            font-size: 1rem;
        }

        .generate-btn {
            width: 100%;
            border: none;
            padding: 17px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7a00ff, #00e5ff);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.2);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        .error {
            display: none;
            background: #4b1111;
            border: 1px solid #ff4444;
            color: #ffaaaa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 30px 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎯 Practice Mode</h1>

    <p class="subtitle">
        Generate a custom mathematics problem set.
    </p>

    <div id="error" class="error"></div>

    <div class="card">

        <h2>Topics</h2>

        <div class="topics">

            <label class="topic">
                <input type="checkbox" value="algebra" checked>
                Algebra
            </label>

            <label class="topic">
                <input type="checkbox" value="numberTheory">
                Number Theory
            </label>

            <label class="topic">
                <input type="checkbox" value="combinatorics">
                Combinatorics
            </label>

            <label class="topic">
                <input type="checkbox" value="inequalities">
                Inequalities
            </label>

        </div>

    </div>

    <div class="card">

        <h2>Difficulty</h2>

        <div class="row">

            <div>
                <label for="difficultyMin">
                    Minimum Difficulty
                </label>

                <input
                    type="number"
                    id="difficultyMin"
                    min="1"
                    max="10"
                    step="0.1"
                    value="5"
                >
            </div>

            <div>
                <label for="difficultyMax">
                    Maximum Difficulty
                </label>

                <input
                    type="number"
                    id="difficultyMax"
                    min="1"
                    max="10"
                    step="0.1"
                    value="8"
                >
            </div>

        </div>

    </div>

    <div class="card">

        <h2>Problem Set</h2>

        <div class="row">

            <div>
                <label for="questionCount">
                    Number of Questions
                </label>

                <input
                    type="number"
                    id="questionCount"
                    min="1"
                    max="100"
                    value="10"
                >
            </div>

            <div>
                <label for="seed">
                    Seed (optional)
                </label>

                <input
                    type="text"
                    id="seed"
                    placeholder="Random"
                >
            </div>

        </div>

    </div>

    <button class="generate-btn" onclick="generatePractice()">
        ⚡ Generate Practice Set
    </button>

    <a href="index.html" class="back">
        ← Back to Mathematics Engine
    </a>

</div>


<!-- ========================================= -->
<!-- MATH GENERATOR ENGINE                     -->
<!-- ========================================= -->

<script src="math-generator/core/random.js"></script>
<script src="math-generator/core/validator.js"></script>
<script src="math-generator/core/answerChecker.js"></script>
<script src="math-generator/core/difficulty.js"></script>

<script src="math-generator/generators/algebra.js"></script>
<script src="math-generator/generators/numberTheory.js"></script>
<script src="math-generator/generators/combinatorics.js"></script>
<script src="math-generator/generators/inequalities.js"></script>

<script src="math-generator/generators/index.js"></script>
<script src="math-generator/core/paperGenerator.js"></script>


<script>

function showError(message) {
    const error = document.getElementById("error");

    error.textContent = message;
    error.style.display = "block";
}


function generatePractice() {

    try {

        const topics = Array.from(
            document.querySelectorAll(".topic input:checked")
        ).map(input => input.value);

        if (topics.length === 0) {
            showError("Select at least one topic.");
            return;
        }

        const difficultyMin =
            parseFloat(document.getElementById("difficultyMin").value);

        const difficultyMax =
            parseFloat(document.getElementById("difficultyMax").value);

        const questionCount =
            parseInt(document.getElementById("questionCount").value);

        const seed =
            document.getElementById("seed").value.trim();


        if (difficultyMin > difficultyMax) {
            showError("Minimum difficulty cannot exceed maximum difficulty.");
            return;
        }

        if (questionCount < 1) {
            showError("You need at least one question.");
            return;
        }


        const config = {

            topics: topics,

            difficultyMin: difficultyMin,

            difficultyMax: difficultyMax,

            questionCount: questionCount,

            seed: seed || undefined

        };


        const randomService =
            new RandomService(config.seed);

        const generator =
            new PaperGenerator(randomService);


        const paper =
            generator.generatePracticePaper(config);


        sessionStorage.setItem(
            "generatedPaper",
            JSON.stringify(paper)
        );

        sessionStorage.setItem(
            "paperMode",
            "practice"
        );


        window.location.href = "paper.html";

    } catch (error) {

        console.error(error);

        showError(
            "Could not generate the paper. Check that all generator files are loaded correctly."
        );

    }

}

</script>

</body>
</html>
